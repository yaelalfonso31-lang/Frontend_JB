<div class="login-wrapper">
    <!-- Capa oscura/verde para que el texto resalte sobre el fondo -->
    <div class="overlay"></div>


    <div class="login-content">

        <div class="welcome-section">
            <div class="logos-container">
                <img ngSrc="assets/logo.jpg" width="230" height="100" alt="Logo Jardín Botánico" class="logo logo-jb"
                    priority>
                <img ngSrc="assets/logo-BUAP.jpg" width="100" height="100" alt="Logo BUAP" class="logo logo-buap"
                    priority>
            </div>
            <h1>Bienvenido<br>al Sistema</h1>
            <p>
                Plataforma operativa y de control de accesos del Jardín Botánico.
                Ingresa tus credenciales para continuar al panel de administración.
            </p>
        </div>

        <!-- Lado Derecho: Formulario -->
        <div class="form-section">
            <div class="login-card">
                <h2>Iniciar sesión</h2>

                <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">

                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input id="email" type="email" formControlName="email" placeholder="ejemplo@botanico.com"
                            [class.is-invalid]="loginForm.controls.email.invalid && loginForm.controls.email.touched">
                    </div>

                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input id="password" type="password" formControlName="password" placeholder="••••••••"
                            [class.is-invalid]="loginForm.controls.password.invalid && loginForm.controls.password.touched">
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox"> Recordarme
                        </label>
                        <button type="button" class="forgot-password-btn" (click)="irARecuperarPassword()">
                            ¿Olvidaste tu contraseña?
                        </button>
                    </div>

                    @if (errorMessage()) {
                    <div class="alert alert-danger">
                        {{ errorMessage() }}
                    </div>
                    }

                    <button type="submit" [disabled]="isLoading()" class="btn-submit">
                        @if (!isLoading()) {
                        <span>Ingresar ahora</span>
                        }
                        @if (isLoading()) {
                        <span>Verificando...</span>
                        }
                    </button>

                    <div class="guest-section">
                        <div class="divider">
                            <span>o</span>
                        </div>
                        <p>¿Eres una escuela interesada en visitarnos?</p>
                        <button type="button" class="btn-secondary" (click)="irAlFormulario()">
                            Llenar Solicitud de Visita
                        </button>
                    </div>

                </form>
            </div>
        </div>

    </div>
</div>
