<div class="administrador-layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <img src="/assets/logo.jpg" alt="Logo BUAP" class="logo" />
      <div class="header-text">
        <span>Jardín Botánico BUAP</span>
        <h2>Colaborador</h2>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/colaborador/dashboard" routerLinkActive="active" class="nav-item">
        <i class="bi bi-grid-1x2-fill"></i>
        <span class="nav-label">Dashboard</span>
      </a>
      <a routerLink="/colaborador/solicitudes" routerLinkActive="active" class="nav-item">
        <i class="bi bi-inboxes-fill"></i>
        <span class="nav-label">Solicitudes</span>
      </a>
      <a routerLink="/colaborador/checklists" routerLinkActive="active" class="nav-item">
        <i class="bi bi-ui-checks"></i>
        <span class="nav-label">Checklists</span>
      </a>
      <a routerLink="/colaborador/instalaciones" routerLinkActive="active" class="nav-item">
        <i class="bi bi-tools"></i>
        <span class="nav-label">Instalaciones</span>
      </a>
      <a routerLink="/colaborador/calendario" routerLinkActive="active" class="nav-item">
        <i class="bi bi-calendar3"></i>
        <span class="nav-label">Calendario</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="logout-btn" (click)="cerrarSesion()">
        <i class="bi bi-box-arrow-left"></i>
        <span>Cerrar Sesión</span>
      </button>
    </div>
  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
