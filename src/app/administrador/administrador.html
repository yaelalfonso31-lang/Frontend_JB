<div class="administrador-layout">
  <aside class="sidebar">
    <div class="sidebar-header">
      <img src="/assets/logo.jpg" alt="Logo BUAP" class="logo" />
      <div class="header-text">
        <span>Jardín Botánico BUAP</span>
        <h2>Administrador</h2>
      </div>
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/administrador/dashboard" routerLinkActive="active" class="nav-item">
        <i class="bi bi-grid-1x2-fill"></i>
        <span class="nav-label">Panel de Control</span>
      </a>
      <a routerLink="/administrador/colaboradores" routerLinkActive="active" class="nav-item">
        <i class="bi bi-people-fill"></i>
        <span class="nav-label">Colaboradores</span>
      </a>
      <a routerLink="/administrador/aprobacion" routerLinkActive="active" class="nav-item">
        <i class="bi bi-person-check-fill"></i>
        <span class="nav-label">Aprobación</span>
      </a>
      <a routerLink="/administrador/solicitudes" routerLinkActive="active" class="nav-item">
        <i class="bi bi-inboxes-fill"></i>
        <span class="nav-label">Solicitudes</span>
      </a>
      <a routerLink="/administrador/checklists" routerLinkActive="active" class="nav-item"
        [class.active]="activeSection === 'checklists'">
        <i class="bi bi-ui-checks"></i>
        <span class="nav-label">Checklists</span>
      </a>
      <a routerLink="/administrador/calendario" routerLinkActive="active" class="nav-item">
        <i class="bi bi-calendar3"></i>
        <span class="nav-label">Calendario</span>
      </a>
      <a routerLink="/administrador/configuracion" routerLinkActive="active" class="nav-item">
        <i class="bi bi-sliders"></i>
        <span class="nav-label">Configuración</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <button class="logout-btn" (click)="cerrarSesion()">
        <i class="bi bi-box-arrow-left"></i>
        <span>Cerrar Sesión</span>
      </button>
    </div>
  </aside>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
